<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submittal Automation</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
</head>
<body>
  <header>
    <h1>Submittal Automation</h1>
    <p>Organize PDFs, import a workplace TOC template, and keep your library up to date.</p>
  </header>

  <main>
    <section class="card">
      <h2>Database</h2>

      <div class="grid">
        <input id="libFileName" placeholder="File Name" />
        <input id="libDisplayTitle" placeholder="File Location" />
        <select id="libDocumentType">
          <option value="Cover Page">Cover Page</option>
          <option value="Table of Contents">Table of Contents</option>
          <option value="Warranty">Warranty</option>
          <option value="Datasheet">Datasheet</option>
          <option value="Shop Drawing">Shop Drawing</option>
          <option value="Drawing">Drawing</option>
          <option value="Manual">Manual</option>
          <option value="Certification">Certification</option>
          <option value="Spec Sheet">Spec Sheet</option>
          <option value="Test Report">Test Report</option>
          <option value="Appendix">Appendix</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <textarea id="libNotes" placeholder="Notes (optional)" rows="3"></textarea>

      <div class="button-row">
        <button id="addLibraryEntryButton">Add to Library</button>
        <button id="exportLibraryCSV">Export Library CSV</button>
        <button id="clearLibraryDB" class="secondary">Clear Library DB</button>
      </div>

      <div style="margin-top:12px; margin-bottom:12px;">
        <input id="librarySearch" placeholder="Search library (file, title, type, notes)" style="width:100%; padding:8px; box-sizing:border-box;" />
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>File Name</th>
            <th>File Location</th>
            <th>Document Type</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="libraryDBBody"></tbody>
      </table>
    </section>
    <section class="card">
      <h2>Table of Contents Template</h2>

      <div class="grid">
        <input type="file" id="tocTemplateUpload" accept=".docx" />
      </div>
      <div class="template-info">
        <span id="templateFileName">No template imported</span>
        <button id="clearTemplateButton" class="secondary" type="button" onclick="clearTOCTemplate()">Clear Template</button>
      </div>
      <textarea id="tocTemplatePreview" placeholder="Imported TOC template contents will appear here..." rows="6"></textarea>
    </section>
    <section class="card">
      <h2>Upload PDFs</h2>
      <input type="file" id="pdfUpload" accept="application/pdf" multiple />
    </section>

    <section class="card">
      <h2>Submittal Info</h2>

      <div class="grid">
        <input id="projectNumber" placeholder="Project Number" />
        <input id="projectName" placeholder="Project Name" />
        <input id="revision" placeholder="Revision" />
        <input id="customerName" placeholder="Location Name" />
      </div>
    </section>

    <section class="card">
      <h2>Packet Builder</h2>

      <!--<label>
        <input type="checkbox" id="autoTOC" checked />
        Auto-generate Table of Contents
      </label>-->

      <div class="button-row">
        <button onclick="buildPacket()">Build PDF Packet</button>
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="clearLibrary()">Clear Library</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
